name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Buscar proyecto
        id: find
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No se encontró settings.gradle en el repositorio."
            ls -R
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: TheFolk-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
